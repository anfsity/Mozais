# Nested debug configuration.
output * bg #15191f solid_color
default_border pixel 0
default_floating_border pixel 0
focus_follows_mouse no

# The wrapper exits Sway when the Flutter process exits, including on a crash.
exec /bin/sh -c 'app="${MOZAIS_APP:?MOZAIS_APP is required}"; log="${MOZAIS_FLUTTER_LOG:-/tmp/mozais-flutter.log}"; "$app" >>"$log" 2>&1; status=$?; swaymsg exit >/dev/null 2>&1 || true; exit "$status"'
